<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼삼수학</title>
    <!-- 앱처럼 보이게 하는 설정들 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { color: #2d3748; text-align: center; margin-bottom: 20px; }
        button { background: #4f46e5; color: white; border: none; padding: 15px; font-size: 18px; border-radius: 12px; cursor: pointer; width: 100%; font-weight: bold; }
        .problem-box { background: #edf2f7; padding: 20px; border-radius: 15px; margin-top: 20px; font-size: 20px; line-height: 1.5; white-space: pre-line; color: #4a5568; }
    </style>
</head>
<body>
    <div class="container">
        <h2>✨ 삼삼수학 AI ✨</h2>
        <button onclick="getProblem()">문제 생성하기</button>
        <div id="problemContainer" class="problem-box" style="display:none;">
            <p id="questionText">AI가 문제를 만드는 중...</p>
        </div>
    </div>

    <script>
        async function getProblem() {
            const container = document.getElementById('problemContainer');
            const text = document.getElementById('questionText');
            container.style.display = 'block';
            text.innerText = "열심히 문제를 만드는 중입니다... ✍️";
            try {
                const response = await fetch('/generate-problem'); 
                const data = await response.json();
                text.innerText = data.problem;
            } catch (error) {
                text.innerText = "오류 발생! 다시 눌러주세요.";
            }
        }
    </script>
</body>
</html>
